version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      # golangci-lint's own default. The stricter 15 this file used to ask for was
      # never actually applied, and four functions sit above it today; see the note in
      # README's Linting section before tightening it.
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 3
  exclusions:
    rules:
      # Tests name their fixtures freely and assert on errors the linter would
      # rather see handled, neither of which says anything about the implementation.
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - goconst
      # Tests rebind err inside guards constantly, which is the idiom rather than a
      # mistake. Production code keeps the check.
      - path: _test\.go
        text: "^shadow:"
        linters:
          - govet
      - path: mock/
        linters:
          - errcheck
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

name: Verify

# The test and lint gate, shared by the workflow that runs on every push and pull
# request and by the release workflow, so a tag is gated by exactly what main was.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      # The action verifies the configuration against the schema before it lints
      # (its verify input defaults to on). That is stricter than run alone, which
      # quietly ignores keys it does not know; a lint setting once went unenforced
      # that way.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          verify: true
          args: --config ./.golangci.yml ./...
